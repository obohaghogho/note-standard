services:
  # 1. Main API Server
  - type: web
    name: note-standard-api
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm install --legacy-peer-deps --prefix server
    startCommand: node server/index.js
    envVars:
      - key: NODE_VERSION
        value: 22.x
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://notestandard.com
      - key: REALTIME_GATEWAY_URL
        fromService:
          type: web
          name: note-standard-gateway
          property: host

  # 2. Realtime Gateway (Socket.IO)
  - type: web
    name: note-standard-gateway
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm install --legacy-peer-deps --prefix realtime-gateway
    startCommand: node realtime-gateway/server.js
    envVars:
      - key: NODE_VERSION
        value: 22.x
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SERVER_URL
        fromService:
          type: web
          name: note-standard-api
          property: host

