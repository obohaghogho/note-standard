// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath 'com.google.gms:google-services:4.4.2'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${findProperty('android.kotlinVersion') ?: '2.1.20'}")
  }
}

ext {
  buildToolsVersion = findProperty('android.buildToolsVersion') ?: "35.0.0"
  minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: "24")
  compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: "35")
  targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: "34")
  ndkVersion = findProperty('android.ndkVersion') ?: "26.1.10909125"
  kotlinVersion = findProperty('android.kotlinVersion') ?: "2.1.20"
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
  configurations.all {
    resolutionStrategy {
      force "org.jetbrains.kotlin:kotlin-stdlib:${findProperty('android.kotlinVersion') ?: '2.1.20'}"
      force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${findProperty('android.kotlinVersion') ?: '2.1.20'}"
      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${findProperty('android.kotlinVersion') ?: '2.1.20'}"
      force "org.jetbrains.kotlin:kotlin-reflect:${findProperty('android.kotlinVersion') ?: '2.1.20'}"
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
