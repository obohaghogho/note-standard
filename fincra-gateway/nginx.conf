# Production Nginx Reverse Proxy Configuration for Fincra Static IP Gateway
# Location on server: /etc/nginx/sites-available/fincra-gateway
# Symlink to: /etc/nginx/sites-enabled/fincra-gateway

server {
    listen 80;
    listen [::]:80;
    server_name gateway.notestandard.com 137.184.216.44;

    # Redirect HTTP to HTTPS (uncomment once Certbot SSL certificate is obtained)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Header forwarding & Keep-Alive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffering & Size Limits
        proxy_buffering on;
        client_max_body_size 1m;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

